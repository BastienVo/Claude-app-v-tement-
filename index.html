<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma Garde-robe</title>
  <meta name="theme-color" content="#1f1d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Garde-robe</h1>
    <button class="icon-btn" id="btn-settings" aria-label="Réglages">⚙︎</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="wardrobe" class="active"><span>👕</span>Garde-robe</button>
    <button data-tab="outfits"><span>✨</span>Tenues</button>
    <button data-tab="shopping"><span>🛍️</span>Achats</button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
